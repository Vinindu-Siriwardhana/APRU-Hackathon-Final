services:
  - type: web
    name: shg-digitiser
    runtime: docker
    plan: free
    autoDeploy: true
    # Offline demo mode by default: no ANTHROPIC_API_KEY is set, so the app
    # only recognises the synthetic sample photos (no Claude calls, no cost).
    #
    # To read real handwriting with Claude instead, add an env var here:
    #   - key: ANTHROPIC_API_KEY
    #     sync: false
    # and set SHG_DISABLE_SIMULATOR=1 to turn off the phone simulator.
